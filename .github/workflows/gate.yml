# The gate (owner, 2026-10-07): every pull request into main or mvc-refactor,
# and every push to either, runs what the `verify` skill runs before a merge,
# on Ubuntu: the fast suite, the golden wire gate (78 scenarios byte for byte
# against legacy/src) and a real launch of the Web view answering /api/setup.
#
# Not here: the Qt pass (optional, the frozen view's, the lead's) and the
# legacy suite (it proves only that legacy/src is still a valid golden
# reference). The headless-Chrome tests skip where puppeteer is absent, as it
# is on this runner; the node-only client checks run with the runner's node.
# Nothing here reaches GitHub's API: the update check is off and the token is
# read-only. Actions are pinned by commit SHA (the tag in the comment).
name: gate

on:
  pull_request:
    branches: [main, mvc-refactor]
  push:
    branches: [main, mvc-refactor]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      STATION_NO_WINDOWS: "1"
      QT_QPA_PLATFORM: offscreen
      STATION_NO_UPDATE_CHECK: "1"
      TRANSFER_STAGE_DATA_ROOT: ${{ github.workspace }}/gate-runs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Fast gate
        run: python -m pytest tests -q -p no:cacheprovider -m "not qt"
      - name: Golden gate
        run: python -m pytest tests/test_wire_golden.py -q -p no:cacheprovider
      - name: Launch (the Web view answers /api/setup)
        run: |
          python src/app.py --web --no-browser --port 8081 > launch.log 2>&1 &
          pid=$!
          code=000
          for _ in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/api/setup || true)"
            [ "$code" = 200 ] && break
            sleep 1
          done
          kill "$pid" 2> /dev/null || true
          wait "$pid" 2> /dev/null || true
          echo "GET /api/setup answered $code"
          if [ "$code" != 200 ]; then
            cat launch.log
            exit 1
          fi
