# P5 (docs/rebuild/PACKAGING_PLAN.md): one bundle per platform, built on the
# platform itself, on every tag `v*` and by hand.
#
#   draft    a tag's release is created as a DRAFT: GitHub's
#            /releases/latest never returns a draft, so no installed bundle
#            sees the release until every build is on it.
#   build    four runners; Python 3.13 from actions/setup-python (the
#            python.org build, so Tk ships); pip install -e .[dev] and
#            the stable app's extra (packaging/requirements-stable.txt);
#            then the bundle layout (packaging/layout.py), in order:
#              tools   packaging/tools.py: arduino-cli (pinned, SHA-256),
#                      arduino:avr + teensy:avr + the libraries, and
#                      teensy_loader_cli compiled from pinned source
#              stable  the STABLE_REF branch checked out into
#                      build/stable-src, frozen by packaging/stable.spec
#              station packaging/station.spec: station-web (the only launcher; Tk and Qt
                      are retired); copies
#                      firmware/, tools/ and stable/ beside them
#                      (STATION_REQUIRE_FULL refuses a partial bundle) and
#                      stamps VERSION and release.json (packaging/release.py)
#            the smoke script, headless (station-web; the layout, tools offline,
#            the stable self-check); zip; upload to
#            the draft.
#   publish  the SHA-256 of every asset appended to the notes (the bundle's
#            updater checks them), then the draft is published as latest.
#
# A run by hand (workflow_dispatch) builds and smokes; its zips are workflow
# artifacts, never a release. Its `stable_ref` input picks the branch frozen
# as stable/ (default `stable`; `main` is today's original app). Actions are
# pinned by commit SHA (the tag in the comment). Nothing signs (P7 is the owner's). Ref names
# reach the shell through env, never through ${{ }} inside a script.
name: package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      stable_ref:
        description: "Branch or commit frozen as stable/ (the original Tk app)"
        required: false
        default: stable

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: Draft the tag's release (notes = the tag's message)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents)' "$TAG" > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "The release $TAG exists; the builds upload to it."
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file notes.md
          fi

  build:
    needs: draft
    # A run by hand has no draft job; a tag's builds wait for the draft.
    if: always() && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        # `asset` is what controller.updater.asset_name() says on that
        # runner; the Zip step refuses a mismatch.
        include:
          - runner: macos-14
            asset: station-macos-arm64.zip
          - runner: macos-15-intel
            asset: station-macos-x86_64.zip
          - runner: windows-latest
            asset: station-windows-x86_64.zip
          - runner: ubuntu-22.04
            asset: station-linux-x86_64.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      TRANSFER_STAGE_DATA_ROOT: ${{ github.workspace }}/smoke-runs
      STATION_NO_UPDATE_CHECK: "1"
      # A tag's run has no inputs: it freezes the `stable` branch.
      STABLE_REF: ${{ inputs.stable_ref || 'stable' }}
      # station.spec refuses to assemble a bundle without tools/ and stable/.
      STATION_REQUIRE_FULL: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: Check out the stable app (STABLE_REF) into build/stable-src
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ env.STABLE_REF }}
          path: build/stable-src
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Linux libraries (SDL, libusb for the Teensy loader)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libusb-dev
      - name: A C compiler for the Teensy loader (Windows)
        if: runner.os == 'Windows'
        run: |
          if ! command -v gcc > /dev/null; then
            choco install mingw -y --no-progress
            echo "C:\ProgramData\mingw64\mingw64\bin" >> "$GITHUB_PATH"
          fi
      - name: Version from the tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then TAG="$REF_NAME"; else TAG="$(git describe --tags --always)"; fi
          echo "STATION_TAG=$TAG" >> "$GITHUB_ENV"
          python packaging/release.py pyproject "$TAG"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r packaging/requirements-stable.txt
      - name: Tools (arduino-cli, cores, libraries, teensy_loader_cli; the only network step)
        run: |
          python packaging/tools.py fetch build/tools
          python packaging/tools.py check build/tools
      - name: Build the stable app (build/stable-src -> dist/station-stable)
        run: |
          export STATION_STABLE_REF="$STABLE_REF"
          export STATION_STABLE_SHA="$(git -C build/stable-src rev-parse HEAD)"
          python -m PyInstaller --noconfirm --clean packaging/stable.spec
      - name: Build the station (assembles firmware/ tools/ stable/; stamps VERSION and release.json)
        run: python -m PyInstaller --noconfirm --clean packaging/station.spec
      - name: Smoke (macOS)
        if: runner.os == 'macOS'
        run: packaging/smoke.sh dist/station
      - name: Smoke (Linux)
        if: runner.os == 'Linux'
        run: packaging/smoke.sh dist/station
      - name: Smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/smoke.ps1 -BundleDir dist/station
      - name: Zip
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          NAME="$(python packaging/release.py asset-name)"
          if [ "$NAME" != "$ASSET" ]; then
            echo "This runner's bundle looks for $NAME; the matrix says $ASSET."
            exit 1
          fi
          python packaging/release.py zip dist/station "$ASSET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
      - name: Upload to the draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ASSET: ${{ matrix.asset }}
        run: gh release upload "$TAG" "$ASSET" --clobber

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    steps:
      - name: Checksums into the notes, then publish as latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir assets
          gh release download "$TAG" --pattern 'station-*.zip' --dir assets
          (cd assets && sha256sum station-*.zip) > sums.txt
          gh release view "$TAG" --json body --jq .body | grep -Ev '^[0-9a-f]{64}  ' > notes.md || true
          { cat notes.md; echo; cat sums.txt; } > body.md
          gh release edit "$TAG" --notes-file body.md --draft=false --latest
