[pytest]
# Run from project root:  pytest tests/
# Run from tests/ dir:    pytest
pythonpath = ../src

# Agent-generated / work-in-progress tests — housed in tests/in_progress/.
# Not part of the validated suite. Excluded from bare `pytest` runs until
# reviewed, fixed, and promoted into tests/core/ or tests/edge_cases/.
# See tests/in_progress/README.md for promotion checklist.
addopts = --ignore=tests/ui --ignore=tests/web --ignore=tests/in_progress --ignore=tests/edge_cases/test_edge_mvc_concurrency.py

[coverage:run]
# Keep .coverage artifact inside the tests/ directory, not the project root.
data_file = .coverage
source = ../src
omit =
    ../src/view/static/*
    ../.venv/*
