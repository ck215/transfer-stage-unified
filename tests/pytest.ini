[pytest]
# Run from project root:  pytest tests/
# Run from tests/ dir:    pytest
#
# Suite organization, per-stage gate commands and the known-bad quarantine
# policy: docs/implementation/testing.md
pythonpath = ../src

# tests/ui/ requires a real decision, not a default-run promotion: including
# it triggers a native SIGABRT (qt_check_pointer inside QApplication()) that
# the existing PySide6-dylib chflags workaround at the top of conftest.py
# does not fully prevent — confirmed by reproducing it directly. Root cause
# not yet fixed; leave excluded until it is.
addopts = --ignore=tests/ui --strict-markers

markers =
    # --- concern markers: select the subset a repair stage actually touches
    lifecycle: model construction, teardown, SystemManager ownership (S2, S6)
    transport: serial transport, write paths, connection state (S3, S8)
    estop: emergency stop and full-stop paths (S3, S8)
    mode: probe mode flags, interlocks, manual/autonomous transitions (S7)
    loops: gamepad polling, input routing, control loop ownership (S5)
    params: parameter typing, validation, commit semantics (S9)
    schema: ui_schema rendering and renderer parity (S10)
    errors: error routing, result channel, popup managers (S11)
    bootstrap: startup, port/controller discovery, model building (S12)
    redpercent: Red Percent monitoring and data log (S13)
    scripting: G-code and macro script execution
    web: web adapter, server and setup flow (S4, S14)
    integration: cross-subsystem tests; slow to diagnose, run late
    invariants: structural grep invariants from root-causes.md (S0)
    # --- execution markers
    slow: dominated by real construction sleeps (~4.5s each); excluded from
        targeted runs via -m "not slow". Re-measure with --durations=40.
    tk: needs the Tkinter mock harness
    qt: needs a real QApplication; may be skipped by the conftest Qt probe
    known_bad: quarantined, xfail(strict). Each has a reason and an owning
        stage in conftest.py's _KNOWN_BAD. Never delete a test to silence it.
    order_dependent: passes in isolation, fails in composition. Excluded from
        targeted and default runs; the final sweep runs it in its own pass.
        See conftest.py's _ORDER_DEPENDENT.

[coverage:run]
# Keep .coverage artifact inside the tests/ directory, not the project root.
data_file = .coverage
source = ../src
omit =
    ../src/views/web/static/*
    ../.venv/*
