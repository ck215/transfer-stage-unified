<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transfer Stage</title>
  <!-- The palette comes from station/views/theme.py, served as CSS
       variables, so the browser and the two desktop views cannot drift
       apart. styles.css names no colour of its own. -->
  <link rel="stylesheet" href="/api/theme.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <h1 class="brand">Transfer Stage</h1>
    <span id="connection" class="badge">connecting</span>
    <div id="closed-models" class="closed"></div>
    <button id="setup-link" type="button" class="button small" hidden>Setup</button>
    <button id="full-stop" type="button" class="button full-stop role-danger off">FULL STOP</button>
  </header>

  <main id="cards" class="cards"></main>

  <!-- Fixed to the bottom of the viewport, so the client measures it and
       reserves exactly that much room at the foot of the page. -->
  <section id="log-panel" class="log-panel">
    <div class="log-head">
      <h2 class="section-title">Events</h2>
      <button id="log-toggle" type="button" class="button small">Hide events</button>
    </div>
    <div id="event-log" class="log"></div>
  </section>

  <!-- Only an event that asks to be acknowledged opens this. -->
  <div id="ack-modal" class="overlay" hidden>
    <div class="dialog">
      <p id="ack-text" class="dialog-text"></p>
      <button id="ack-ok" type="button" class="button role-neutral">OK</button>
    </div>
  </div>

  <!-- The region picker: drag on the station's own screen grab. -->
  <div id="region-picker" class="overlay" hidden>
    <div class="dialog wide-dialog">
      <p class="dialog-text">Drag a rectangle to set the region.</p>
      <canvas id="region-canvas" class="region-canvas" width="800" height="450"></canvas>
      <button id="region-close" type="button" class="button role-neutral">Cancel</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
