[pytest]
pythonpath = src

# Scratch/agent-generated tests — not part of the validated suite; prune or graduate
# them before merging.  Excluded here so bare `pytest` doesn't trip on them.
collect_ignore_glob =
    tests/test_hal_round*.py
    tests/test_model_round*.py
    tests/test_controller_round1.py
    tests/test_view_round1.py
    tests/test_probes.py
    tests/test_qa_round1.py
    tests/test_redpercent.py
    tests/test_temperature.py

# Qt platform tests require a real display; skip on headless CI / dev machines.
# Run manually: pytest tests/ui/ -p qt
# Concurrency test needs full display fixture — run separately on rig.
addopts = --ignore=tests/ui --ignore=tests/web --ignore=tests/edge_cases/test_edge_mvc_concurrency.py
