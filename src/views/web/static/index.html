<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Filled from the theme's --bg by the client, so this file names no colour. -->
  <meta name="theme-color" content="">
  <title>Transfer stage</title>
  <!-- The palette comes from src/views/theme.py, served as CSS
       variables, so the browser and the two desktop views cannot drift
       apart. styles.css names no colour of its own. -->
  <link rel="stylesheet" href="/api/theme.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="preload" href="/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/rubik-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>
<!-- is-prelaunch: no Stop on the rail until the launch (owner 2026-10-07);
     app.js removes it for the session (revealStop). -->
<body class="is-prelaunch">
  <a class="skip-link" href="#cards">Skip to the main content</a>
  <!-- The rail: the station's name, the one stop that is never in doubt,
       the models by name, and the way to Setup and out. No numbers: a
       reading is said once, on the sheet. -->
  <header class="rail">
    <!-- Signature: the nameplate - the station's name, the stop and its
         chord on one CAP plate with an engraved double frame and four
         drawn fasteners. -->
    <div class="plate">
      <span class="screw screw-tl" aria-hidden="true"></span>
      <span class="screw screw-tr" aria-hidden="true"></span>
      <span class="screw screw-bl" aria-hidden="true"></span>
      <span class="screw screw-br" aria-hidden="true"></span>
      <div class="rail-head">
        <h1 class="station-name">Transfer stage</h1>
        <!-- Silent while all is well: the simulation line only when there is
             no hardware, the link line only when the station stops answering. -->
        <span id="sim-line" class="rail-note" hidden></span>
        <span id="connection" class="link-state" role="status" aria-live="polite"></span>
      </div>
      <div class="stop-block">
        <!-- The stop: a SIGNAL key in an ink guard collar, a pale socket
             band between them. Latched (every model) the key drops, the
             band floods SKIRT, the collar turns SIGNAL and the release
             glyph shows above "Clear". -->
        <div id="stop-ring" class="stop-ring">
          <button id="full-stop" type="button" class="mushroom" aria-label="Stop every model"
                  aria-keyshortcuts="Control+Period"
                  title="Stop every model. Keyboard: Ctrl+., from anywhere on the page.">
            <span class="mushroom-glyph glyph glyph-clear" aria-hidden="true"></span>
            <span class="mushroom-face">Stop</span>
          </button>
        </div>
        <!-- The stop's keyboard path, said where the stop is (F9), in every
             state: the chord always stops, and never clears (L1). Two
             keycaps; the words still read "Stop: Ctrl+.". -->
        <span class="stop-hint" aria-hidden="true"><span class="chord-word">Stop:</span> <kbd>Ctrl</kbd>+<kbd>.</kbd></span>
        <!-- views.base.stop_words()["rail"]: a partial stop's names, "every
             model latched", or the models that did not confirm (L1). -->
        <p id="rail-latched" class="rail-latched" hidden></p>
      </div>
    </div>
    <!-- What must be read from across the bench and must not be lost to
         the next event: a stop that did not reach the station, a lost
         device, a Quit that did not land. -->
    <div id="rail-alert" class="rail-alert" role="alert" hidden></div>
    <!-- N2: one line per probe inside its idle warning window, counted
         from state, with Extend. Not a live region: the number changes
         every second; its first appearance is announced (announce-polite). -->
    <div id="idle-lines" class="idle-lines" hidden></div>
    <!-- N3: while anything is energized, what closing this tab does. Ink,
         not red: it is a caution, not a stop. -->
    <p id="energized-line" class="rail-energized" hidden></p>
    <!-- Owner 2026-10-07: who is signed in, at the top of the page list -
         a menu (the account sheet opens beside the rail like Settings),
         not a device: no dot, no stop switch. Hidden with accounts off. -->
    <button id="account-link" type="button" class="account-link"
            aria-controls="account-drawer" aria-expanded="false" hidden>
      <span class="account-glyph" aria-hidden="true"></span>
      <span class="account-name" translate="no"></span>
    </button>
    <nav id="model-nav" class="model-nav" aria-label="Pages"></nav>
    <div class="rail-foot">
      <button id="tutorials-link" type="button" class="ghost rail-control"
              title="Step-by-step tutorials that point at the controls">Tutorials</button>
      <!-- "Setup" before the launch, "Settings" after it (the devices are
           fixed then); the client keeps the words in step (applySetupWords). -->
      <button id="setup-link" type="button" class="ghost rail-control"
              aria-controls="setup-drawer"
              title="Open Setup: ports, devices and launch">Setup</button>
      <!-- Quit now; closing the live tab quits the same way a few seconds
           later (owner 2026-10-07), after the browser's "Leave site?". -->
      <button id="quit-link" type="button" class="ghost rail-control text-key"
              aria-label="Quit the station program"
              title="Quit the station program: stops every model, closes every port and exits (asks first)">Quit</button>
    </div>
  </header>

  <main class="page">
    <!-- O7 (A11Y-2): what the stop says, spoken. The polite region carries
         the headline and the rail line when they change; the assertive one
         the stop, the clear and a latch, once each. Read, not drawn. -->
    <p id="announce-polite" class="sr-only" role="status" aria-live="polite"></p>
    <p id="announce-assertive" class="sr-only" role="alert" aria-live="assertive"></p>
    <!-- Said once, at the top of the sheet, while every model is latched:
         views.base.stop_words()["headline"] and its subline (L1). -->
    <div id="sheet-headline" class="sheet-headline" hidden>
      <p class="headline"></p>
      <p class="headline-note"></p>
    </div>
    <div id="cards" class="sheet" tabindex="-1" role="region" aria-label="Models"></div>
  </main>

  <!-- Setup is a drawer, not an entry: it is where a run begins and where it
       is re-planned, and it withdraws once the station is running. -->
  <div id="scrim" class="scrim" hidden></div>
  <aside id="setup-drawer" class="drawer" aria-label="Setup" tabindex="-1">
    <header class="drawer-head">
      <h2 class="drawer-title">Setup</h2>
      <button id="drawer-close" type="button" class="ghost rail-control"
              title="Close Setup (Escape). The Setup button on the rail brings it back.">Close</button>
    </header>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>

  <!-- The account menu (owner 2026-10-07): the signed-in user's sheet, a
       side window beside the rail like Settings, never over the stop. -->
  <aside id="account-drawer" class="drawer account-drawer" aria-label="Account" tabindex="-1">
    <header class="drawer-head">
      <h2 class="drawer-title">Account</h2>
      <button id="account-close" type="button" class="ghost rail-control"
              title="Close the account menu (Escape)">Close</button>
    </header>
    <div id="account-body" class="drawer-body"></div>
  </aside>

  <!-- The sign-in screen (2026-10-07): before Setup, until the operator
       signs in, makes an account or proceeds as guest. Beside the rail like
       every layer: the stop is never behind it. Setup's state says when it
       shows (`account.chosen`). -->
  <section id="sign-in-gate" class="gate" aria-labelledby="gate-title" hidden>
    <div class="gate-body">
      <!-- Where the operator is on the way in: sign in, Setup, the station.
           One list, moved by the client to the head of whichever screen is
           up (the sign-in screen, then pre-launch Setup) and gone after the
           launch (renderSteps). In the flow, never fixed: it covers nothing. -->
      <ol id="steps" class="steps" aria-label="Getting started">
        <li class="step" data-step="sign-in" aria-current="step">Sign in</li>
        <li class="step" data-step="setup">Setup</li>
        <li class="step" data-step="station">Dashboard</li>
      </ol>
      <h2 id="gate-title" class="gate-title">Sign in</h2>
      <form id="gate-form" class="gate-form" novalidate>
        <label class="gate-field"><span>Email</span>
          <input id="gate-email" class="input" name="email" type="email"
                 autocomplete="username" spellcheck="false" inputmode="email"></label>
        <label class="gate-field"><span>Password</span>
          <input id="gate-password" class="input" name="password" type="password"
                 autocomplete="current-password"></label>
        <p id="gate-error" class="gate-error" role="alert"></p>
        <div class="gate-actions">
          <button id="gate-sign-in" type="submit" class="button role-go">Sign in</button>
          <button id="gate-create" type="button" class="button role-neutral">Create account…</button>
        </div>
      </form>
      <div class="gate-guest">
        <p class="gate-note">If you have not been trained on accounts for this equipment, proceed as guest for standard operation.</p>
        <button id="gate-guest" type="button" class="button role-neutral">Proceed as guest</button>
      </div>
    </div>
  </section>

  <!-- One line at the foot of the page: the latest warning or error, and
       the room to read the log when you ask for it. Normal is silence. -->
  <section id="log-panel" class="tray">
    <div class="tray-head">
      <span id="tray-latest" class="tray-latest" role="status" aria-live="polite"><span class="tray-text"></span></span>
      <button id="log-toggle" type="button" class="ghost rail-control"
              aria-controls="event-log">Show events</button>
    </div>
    <div id="event-log" class="tray-log"></div>
  </section>

  <!-- Only an event that asks to be acknowledged opens this. Every layer
       starts beside the rail: nothing this page opens covers the stop.
       No aria-modal on any of the three (O7, A11Y-3): the rail stays
       operable beside them on purpose, and "modal" would tell a screen
       reader the stop is out of reach. -->
  <div id="ack-modal" class="overlay" hidden>
    <div class="dialog" role="alertdialog" aria-labelledby="ack-text">
      <p id="ack-count" class="dialog-count" hidden></p>
      <div id="ack-text" class="dialog-text ack-list"></div>
      <button id="ack-ok" type="button" class="button role-neutral">Acknowledge</button>
    </div>
  </div>

  <!-- The page's own confirmation: Cancel is the default, Escape is Cancel. -->
  <div id="confirm-modal" class="overlay" hidden>
    <div class="dialog" role="alertdialog" aria-labelledby="confirm-text">
      <p id="confirm-text" class="dialog-text"></p>
      <div class="dialog-actions">
        <button id="confirm-no" type="button" class="button role-neutral">Cancel</button>
        <button id="confirm-yes" type="button" class="button role-neutral">Continue</button>
      </div>
    </div>
  </div>

  <!-- The region picker: drag on the station's own screen grab. -->
  <!-- O10 (WDG8-5): or type it - four fields in the station's screen
       pixels are the keyboard path; a drag fills them too. -->
  <div id="region-picker" class="overlay" hidden>
    <div class="dialog wide-dialog" role="dialog" aria-labelledby="region-help">
      <p id="region-help" class="dialog-text">Drag a rectangle over the part of the screen to watch.</p>
      <canvas id="region-canvas" class="region-canvas" width="800" height="450"
              aria-label="The station's screen. Drag to choose the capture region."></canvas>
      <div class="region-fields" role="group" aria-label="Capture region, in screen pixels">
        <label class="region-field"><span>X</span><input class="input" name="x" type="number" step="1" inputmode="numeric" autocomplete="off"></label>
        <label class="region-field"><span>Y</span><input class="input" name="y" type="number" step="1" inputmode="numeric" autocomplete="off"></label>
        <label class="region-field"><span>Width</span><input class="input" name="width" type="number" step="1" min="1" inputmode="numeric" autocomplete="off"></label>
        <label class="region-field"><span>Height</span><input class="input" name="height" type="number" step="1" min="1" inputmode="numeric" autocomplete="off"></label>
      </div>
      <div class="dialog-actions">
        <button id="region-close" type="button" class="button role-neutral">Cancel</button>
        <button id="region-use" type="button" class="button role-neutral">Use this region</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script src="/tutorial.js"></script>
</body>
</html>
