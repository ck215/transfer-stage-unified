<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Filled from the theme's --bg by the client, so this file names no colour. -->
  <meta name="theme-color" content="">
  <title>Transfer Stage</title>
  <!-- The palette comes from src/views/theme.py, served as CSS
       variables, so the browser and the two desktop views cannot drift
       apart. styles.css names no colour of its own. -->
  <link rel="stylesheet" href="/api/theme.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="preload" href="/fonts/ibm-plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/ibm-plex-sans-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/ibm-plex-sans-600.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <a class="skip-link" href="#cards">Skip to the modules</a>
  <!-- The status rail is the instrument's face: the numbers the operator
       watches, and one stop that is never in doubt. -->
  <header class="rail">
    <div class="rail-head">
      <h1 class="station-name">Transfer stage</h1>
      <span id="connection" class="link-state" role="status" aria-live="polite">Connecting…</span>
    </div>
    <div id="rail-readouts" class="rail-readouts" aria-label="Key readouts"></div>
    <div class="rail-side">
      <div id="closed-models" class="closed"></div>
      <!-- The stop's keyboard path, said where the stop is (F9). -->
      <span class="stop-hint" aria-hidden="true">Stop: Ctrl+.<br>Cmd+. on a Mac</span>
      <button id="setup-link" type="button" class="ghost rail-control"
              title="Open Setup: ports, devices and launch">Setup</button>
    </div>
    <button id="full-stop" type="button" class="mushroom" aria-label="Stop every model"
            aria-keyshortcuts="Control+Period Meta+Period"
            title="Stop every model. Keyboard: Ctrl+. (Cmd+. on a Mac), from anywhere on the page.">
      <span class="mushroom-face">Stop</span>
    </button>
    <!-- What the operator must read from across the bench and must not lose
         to the next event: a stop that did not land, a lost device. -->
    <div id="rail-alert" class="rail-alert" role="alert" hidden></div>
  </header>

  <main id="cards" class="rack" tabindex="-1"></main>

  <!-- Setup is a drawer, not a module: it is where a run begins and where it
       is re-planned, and it withdraws once the station is running. -->
  <div id="scrim" class="scrim" hidden></div>
  <aside id="setup-drawer" class="drawer" aria-label="Setup" tabindex="-1">
    <header class="drawer-head">
      <h2 class="drawer-title">Setup</h2>
      <button id="drawer-close" type="button" class="ghost rail-control"
              title="Close Setup (Escape). The Setup button on the rail brings it back.">Close</button>
    </header>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>

  <!-- One line at the foot of the page: the latest event, and the room to
       read the last few when you ask for it. -->
  <section id="log-panel" class="tray">
    <div class="tray-head">
      <span id="tray-latest" class="tray-latest" role="status" aria-live="polite">Waiting for the station…</span>
      <button id="log-toggle" type="button" class="ghost rail-control"
              aria-controls="event-log">Show events</button>
    </div>
    <div id="event-log" class="tray-log"></div>
  </section>

  <!-- Only an event that asks to be acknowledged opens this. Every layer
       below starts under the rail: nothing this page opens covers the stop. -->
  <div id="ack-modal" class="overlay" hidden>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="ack-text">
      <p id="ack-count" class="dialog-count" hidden></p>
      <div id="ack-text" class="dialog-text ack-list"></div>
      <button id="ack-ok" type="button" class="button role-neutral">Acknowledge</button>
    </div>
  </div>

  <!-- The page's own confirmation: Cancel is the default, Escape is Cancel. -->
  <div id="confirm-modal" class="overlay" hidden>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-text">
      <p id="confirm-text" class="dialog-text"></p>
      <div class="dialog-actions">
        <button id="confirm-no" type="button" class="button role-neutral">Cancel</button>
        <button id="confirm-yes" type="button" class="button role-neutral">Continue</button>
      </div>
    </div>
  </div>

  <!-- The region picker: drag on the station's own screen grab. -->
  <div id="region-picker" class="overlay" hidden>
    <div class="dialog wide-dialog" role="dialog" aria-modal="true" aria-labelledby="region-help">
      <p id="region-help" class="dialog-text">Drag a rectangle over the part of the screen to watch.</p>
      <canvas id="region-canvas" class="region-canvas" width="800" height="450"
              aria-label="The station's screen. Drag to choose the capture region."></canvas>
      <button id="region-close" type="button" class="button role-neutral">Cancel</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
